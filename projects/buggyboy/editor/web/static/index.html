<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BuggyBoy course editor — 3D</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="scene"></div>
  <canvas id="game" width="320" height="200"></canvas>

  <div id="ui">
    <div class="panel">
      <h1>BuggyBoy course</h1>
      <div class="row" id="legs"></div>
      <div class="row">
        <button id="mode">mode: orbit</button>
        <button id="play">▶ play (real game)</button>
        <button id="save">save COURSES.DAT</button>
      </div>
      <div class="hint">
        <b>3D:</b> W/S throttle · A/D steer · M orbit/drive · drag to look<br>
        <b>play:</b> arrows / WASD drive · space fire · authentic verified render
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel">
      <h2>segment slopes</h2>
      <div class="hint">edit a segment's hill slope — the 3D road updates live</div>
      <div id="segs" class="segs"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
