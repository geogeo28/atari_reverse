; hatari-machine.cfg — the part of THE machine that has no command-line flag in hatari_rom.py.
;
; Hatari loads a configuration file before it parses any option: $HOME/.config/hatari/hatari.cfg,
; or — with no HOME in the environment — hatari.cfg in the CURRENT DIRECTORY. Every setting in it
; that no flag overrides is part of the emulated machine, silently. MEASURED here: a hatari.cfg in
; this directory holding nothing but the four [Screen] lines below (with TRUE) moved the boot metric
; from 461/1534 to 479/1340, took the desktop from three distinct colours to two, and changed the
; pinned RAM — no warning, nothing on the command line to say so.
;
; So every driver passes `-c` this file, FIRST on the command line, and it names the settings that
; would otherwise be whatever the host happens to carry. What the command line already pins (the
; machine, memory size, monitor, sound, TOS patching, floppy A, write protection) is NOT repeated
; here: a second spelling is a second thing to keep right.
;
; Unknown keys and sections are ignored in silence (measured: a misspelt key produces no message at
; any log level), so a typo here disables a pin rather than failing — which is why the VDI pin has a
; run of its own in README.md proving that turning it on from a config file is caught.

[System]
; --machine st RE-SEEDS all three of these from the model's defaults, so these lines agree with what
; the flag will do rather than fighting it (measured: --cpuclock 32 BEFORE --machine st has no
; effect; after it, TOSBENCH's Bconout workload drops from 155 ticks to 38). They are here so the
; machine is stated in one readable place, and so a future run that stops passing --machine still
; gets a 68000 at 8 MHz with no blitter.
nCpuLevel = 0
nCpuFreq = 8
bCompatibleCpu = TRUE
bBlitter = FALSE

[Screen]
; The extended-VDI screen: a resolution the ST never had, which changes the desktop, the sysvars and
; every byte of the boot surface. This is the setting the measurement above was taken with.
bUseExtVdiResolutions = FALSE

[HardDisk]
; A mounted hard disk or GEMDOS directory changes _drvbits, Drvmap and the boot device — and under
; TOS 1.02 Hatari refuses GEMDOS directory emulation outright (it wants 1.04), which is a fault
; marker in the log rather than a machine.
bUseHardDiskDirectory = FALSE
bUseHardDiskImage = FALSE
bBootFromHardDisk = FALSE

[Floppy]
; Drive B holding a copy of drive A's disk is a different floppy probe at boot.
bAutoInsertDiskB = FALSE
